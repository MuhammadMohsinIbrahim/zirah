# D1 tool poisoning (static): text the model reads but the user does not see.
#
# The invisible-character rules look at every string in the manifest. Each rule leaves room
# for the legitimate uses of the same characters: joiners inside Arabic-script and Indic
# words and emoji sequences, tag characters in subdivision flags, single variation
# selectors, and left-to-right/right-to-left marks in mixed-direction text are not flagged.
#
# The hidden-instruction and smuggling rules (from D1-INSTRUCTION-TAG on) look at tools
# only; the same phrases in prompts, resources and server instructions are D2's job.
rules:
  - id: D1-ZERO-WIDTH
    module: D1
    severity: high
    confidence: high
    owasp: [MCP03]
    title: Invisible zero-width or filler characters
    remediation: >-
      Remove the invisible characters. They render as nothing but still reach the model, so
      they can hide text or split words to slip past filters.
    kind: codepoints
    patterns:
      - U+200B          # zero width space
      - U+2060-U+2064   # word joiner, invisible math operators
      - U+FEFF          # zero width no-break space (a byte order mark inside text)
      - U+180E          # Mongolian vowel separator
      - U+034F          # combining grapheme joiner
      - U+115F-U+1160   # Hangul choseong and jungseong fillers
      - U+3164          # Hangul filler
      - U+FFA0          # halfwidth Hangul filler
    references:
      - https://unicode.org/reports/tr36/

  - id: D1-JOINER-OUT-OF-CONTEXT
    module: D1
    severity: medium
    confidence: medium
    owasp: [MCP03]
    title: Zero-width joiner outside a script or emoji that uses it
    remediation: >-
      Remove the zero-width joiner or non-joiner. They are only needed between letters of
      scripts such as Arabic, Urdu, Persian or Devanagari, or inside emoji sequences.
    kind: regex
    # A joiner is fine when both neighbours belong to a joining script or an emoji
    # sequence; it is flagged when either neighbour does not.
    patterns:
      - '(?<![\u0600-\u074f\u0750-\u077f\u07c0-\u07ff\u0870-\u08ff\u0900-\u0dff\u0e00-\u0fff\u1000-\u109f\u1780-\u18af\ua8e0-\ua8ff\ufb50-\ufdff\ufe70-\ufefc\xa9\xae\u203c-\u3299\ufe0f\U0001F000-\U0001FAFF])[\u200c\u200d]'
      - '[\u200c\u200d](?![\u0600-\u074f\u0750-\u077f\u07c0-\u07ff\u0870-\u08ff\u0900-\u0dff\u0e00-\u0fff\u1000-\u109f\u1780-\u18af\ua8e0-\ua8ff\ufb50-\ufdff\ufe70-\ufefc\xa9\xae\u203c-\u3299\U0001F000-\U0001FAFF])'

  - id: D1-BIDI-OVERRIDE
    module: D1
    severity: high
    confidence: high
    owasp: [MCP03]
    title: Bidirectional override characters
    remediation: >-
      Remove the override characters. They reorder how text is displayed, so what the user
      reads is not what the model receives.
    kind: codepoints
    patterns:
      - U+202D-U+202E   # left-to-right and right-to-left override
    references:
      - https://trojansource.codes/

  - id: D1-BIDI-EMBEDDING
    module: D1
    severity: medium
    confidence: medium
    owasp: [MCP03]
    title: Bidirectional embedding or isolate characters
    remediation: >-
      Remove the embedding or isolate characters. Plain left-to-right and right-to-left
      marks are enough for mixed-direction text and are not flagged.
    kind: codepoints
    patterns:
      - U+202A-U+202C   # embeddings and pop directional formatting
      - U+2066-U+2069   # isolates
    references:
      - https://trojansource.codes/

  - id: D1-TAG-CHARACTERS
    module: D1
    severity: high
    confidence: high
    owasp: [MCP03]
    title: Invisible Unicode tag characters (ASCII smuggling)
    remediation: >-
      Remove the tag characters. Each one invisibly encodes an ASCII character, so they can
      carry a whole hidden instruction.
    kind: regex
    # Subdivision flags (e.g. England: black flag + "gbeng" in tags + cancel tag) are the
    # one legitimate use and are skipped; a longer tag run after a black flag is not.
    patterns:
      - '\U0001F3F4(?![\U000E0030-\U000E0039\U000E0061-\U000E007A]{2,6}\U000E007F(?![\U000E0000-\U000E007F]))[\U000E0000-\U000E007F]+'
      - '(?<![\U0001F3F4\U000E0000-\U000E007F])[\U000E0000-\U000E007F]+'
    references:
      - https://embracethered.com/blog/posts/2024/hiding-and-finding-text-with-unicode-tags/

  - id: D1-VARIATION-SELECTOR-RUN
    module: D1
    severity: high
    confidence: medium
    owasp: [MCP03]
    title: Run of variation selectors (hidden data)
    remediation: >-
      Remove the variation selectors. Emoji and ideographs use one at a time; a run of them
      can encode hidden bytes.
    kind: regex
    patterns:
      - '[\ufe00-\ufe0f\U000E0100-\U000E01EF]{2,}'

  - id: D1-ANSI-ESCAPE
    module: D1
    severity: high
    confidence: high
    owasp: [MCP03]
    title: Terminal escape sequences or bell characters
    remediation: >-
      Remove the escape sequences. In a terminal they can hide, recolour or rewrite text, so
      what a user reviews is not what the model reads.
    kind: regex
    ignore_case: false
    patterns:
      - '\x1b(?:\[[0-?]*[ -/]*[@-~]|\][^\x07\x1b]*(?:\x07|\x1b\\)?|[@-Z\\-_])?'
      - '\x9b[0-?]*[ -/]*[@-~]'
      - '\x07'   # bell, alone; one ending an OSC sequence is part of the match above

  - id: D1-CONTROL-CHARACTERS
    module: D1
    severity: medium
    confidence: high
    owasp: [MCP03]
    title: Control characters in text
    remediation: >-
      Remove the control characters. Tabs and line breaks are fine; other control characters
      have no place in names or descriptions.
    kind: codepoints
    patterns:
      - U+0000-U+0006   # U+0007 (bell) is covered by D1-ANSI-ESCAPE
      - U+0008
      - U+000B-U+000C
      - U+000E-U+001A
      - U+001C-U+001F   # U+001B (escape) is covered by D1-ANSI-ESCAPE
      - U+007F-U+009A
      - U+009C-U+009F   # U+009B (C1 CSI) is covered by D1-ANSI-ESCAPE

  - id: D1-HOMOGLYPH-MIXED-SCRIPT
    module: D1
    severity: high
    confidence: medium
    owasp: [MCP03]
    title: Word mixes Latin letters with look-alike letters from another script
    remediation: >-
      Use one script per word. A name like "rеad_file" with a Cyrillic "е" looks identical
      to a trusted tool but is a different string.
    kind: regex
    ignore_case: false
    # Whole words in Cyrillic, Greek or Armenian are fine; a single word that mixes them
    # with Latin letters is not. Greek letters are limited to Latin look-alikes, so units
    # such as "μs" stay clean.
    patterns:
      - '\b(?=\w*[A-Za-z])(?=\w*[\u0400-\u052f\u0531-\u0556\u0561-\u0587\u0391\u0392\u0395\u0396\u0397\u0399\u039a\u039d\u039f\u03a1\u03a4\u03a5\u03a7\u03b1\u03b9\u03ba\u03bd\u03bf\u03c1\u03c5])\w+'
    references:
      - https://unicode.org/reports/tr39/

  # --- Hidden instructions (tools only) -------------------------------------------------

  - id: D1-INSTRUCTION-TAG
    module: D1
    severity: high
    confidence: medium
    owasp: [MCP03]
    title: Instruction or role tags aimed at the model
    remediation: >-
      Remove the tags. A tool description should say what the tool does; tags such as
      <IMPORTANT> or [SYSTEM] are there to make the model treat the text as orders.
    kind: regex
    surfaces: [tools]
    patterns:
      - '<\s*/?\s*(?:important|system|instructions?|hidden|critical|override|assistant)\s*>'
      - '(?-i:\[/?(?:SYSTEM|INST|IMPORTANT)\])'
      - '<\|\s*(?:im_start|im_end|system|assistant)\s*\|>'
      - '<</?SYS>>'
    references:
      - https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks

  - id: D1-IGNORE-PREVIOUS
    module: D1
    severity: critical
    confidence: high
    owasp: [MCP03]
    title: Tells the model to ignore its other instructions
    remediation: >-
      Remove the text. A tool has no reason to tell the model to disregard its instructions
      or other tools.
    kind: regex
    surfaces: [tools]
    patterns:
      - '\b(?:ignore|disregard|forget|override)\s+(?:all\s+|any\s+)?(?:of\s+)?(?:the\s+|your\s+)?(?:previous|prior|above|earlier|preceding|original|system|other)\s+(?:instructions?|prompts?|directions|guidelines)\b'

  - id: D1-CONCEAL-FROM-USER
    module: D1
    severity: high
    confidence: high
    owasp: [MCP03]
    title: Tells the model to keep something from the user
    remediation: >-
      Remove the text. A tool that asks the model to hide what it does from the user is
      acting against the user.
    kind: regex
    surfaces: [tools]
    patterns:
      - '\b(?:do\s+not|don''t|never|must\s+not)\s+(?:tell|inform|notify|alert|warn)\s+(?:the\s+)?user'
      - '\b(?:do\s+not|don''t|never|must\s+not)\s+(?:mention|reveal|disclose)\b[^.\n]{0,40}?\bto\s+(?:the\s+)?user'
      - '\b(?:do\s+not|don''t|never)\s+(?:mention|reveal|disclose)\s+(?:that|this|it|anything)\b'
      - '\b(?:do\s+not|don''t|never)\s+let\s+(?:the\s+)?user\s+(?:know|see|find\s+out)'
      - '\bwithout\s+(?:telling|informing)\s+(?:the\s+)?user'
      - '\b(?:keep|hide)\s+(?:this|these|it|them)\s+(?:(?:secret|hidden)\s+)?from\s+(?:the\s+)?user'
      - '\b(?:the\s+)?user\s+(?:must|should)\s+(?:not|never)\s+(?:know|see|be\s+(?:told|informed|aware))'
      - '\b(?:secretly|covertly)\s+\w+'

  - id: D1-SENSITIVE-FILE-ACCESS
    module: D1
    severity: critical
    confidence: medium
    owasp: [MCP03]
    title: Asks the model to read or send credential files
    remediation: >-
      Remove the request. Tool descriptions must not ask the model to open or pass on SSH
      keys, cloud credentials, client configs or other secrets.
    kind: regex
    surfaces: [tools]
    # Secret stores: any access verb before the path. Config files that legitimately get
    # read (.env, MCP client configs) only count when their content is to be passed on.
    patterns:
      - '\b(?:read|open|cat|load|send|upload|include|attach|pass|provide|copy|forward|fetch|access|get|extract|collect|grab|print|dump)\b[^\n]{0,60}?(?:~/\.ssh\b(?!/(?:config|known_hosts)\b)|\.ssh/id_\w+\b(?!\.pub)|\bid_(?:rsa|ed25519|ecdsa|dsa)\b(?!\.pub)|\.aws/credentials|/etc/(?:passwd|shadow)|\.netrc\b|\.git-credentials|\.(?:bash|zsh)_history)'
      - '(?:\.env\b|mcp\.json|claude_desktop_config\.json)[^\n]{0,80}?\b(?:pass|send|include|attach|append|forward|upload)\b'
      - '\b(?:send|upload|include|attach|append|forward|pass)\b[^\n]{0,60}?(?:\.env\b|mcp\.json|claude_desktop_config\.json)'

  - id: D1-DATA-EXFIL-REQUEST
    module: D1
    severity: high
    confidence: medium
    owasp: [MCP03]
    title: Asks the model to pass on the conversation or credentials
    remediation: >-
      Remove the request. A tool should take the arguments it needs, not the conversation,
      the system prompt or the user's credentials.
    kind: regex
    surfaces: [tools]
    patterns:
      - '\b(?:pass|send|include|append|add|attach|forward|upload|copy|put|embed|provide)\b[^.\n]{0,50}?\b(?:(?:entire|full|whole|complete)\s+(?:conversation|chat)|(?:conversation|chat)\s+(?:history|transcript|log)|(?:the\s+)?(?:conversation|chat)\s+so\s+far|your\s+system\s+prompt|(?:the\s+)?user''?s\s+(?:api\s+keys?|passwords?|credentials|tokens?|secrets?|private\s+keys?)|all\s+(?:api\s+keys|access\s+tokens|secrets|credentials|passwords))\b'

  - id: D1-COVERT-FORWARD
    module: D1
    severity: critical
    confidence: medium
    owasp: [MCP03]
    title: Quietly copies messages to a fixed address
    remediation: >-
      Remove the instruction. Recipients should come from the user's request, not from a
      standing order in the tool description.
    kind: regex
    surfaces: [tools]
    patterns:
      - '\b(?:always|also|silently|secretly|quietly|automatically)\s+(?:bcc|cc|forward|copy|send(?:\s+a\s+copy)?)\b[^\n]{0,80}?[\w.+-]+@[\w-]+(?:\.[\w-]+)+'
      - '\bbcc\s*:\s*[\w.+-]+@[\w-]+(?:\.[\w-]+)+'
    references:
      - https://www.koi.ai/blog/postmark-mcp-npm-malicious-backdoor-email-theft

  - id: D1-SCANNER-EVASION
    module: D1
    severity: high
    confidence: high
    owasp: [MCP03]
    title: Text aimed at a security reviewer or scanner to sway its verdict
    remediation: >-
      Remove the text. A tool description has no reason to address whoever audits it, and
      telling a reviewer, scanner or AI judge that the tool is safe or has no findings is an
      attempt to hide something else in the same text.
    kind: regex
    surfaces: [tools]
    patterns:
      # Someone addresses the reviewer, then tries to steer the verdict. The reviewer has to
      # be addressed ("note to the security reviewer", "if you are an AI judge", "the model
      # analyzing this"); merely mentioning a security review is not enough.
      - |-
        (?x:
          (?:
              \b(?:note|message|notice|hint|instructions?|attention|memo)\s+(?:to|for)\s+(?:the\s+|any\s+|all\s+)?
              (?:(?:ai|llm|automated|security|code|model)\s+)*
              (?:reviewers?|scanners?|auditors?|judges?|analy[sz]ers?|classifiers?|evaluators?|moderators?|checkers?|graders?|inspectors?)\b
            | \b(?:dear|hey|hello|hi)\s+(?:the\s+)?(?:(?:ai|llm|automated|security|code)\s+)*
              (?:reviewers?|scanners?|auditors?|judges?|analy[sz]ers?|classifiers?|evaluators?|moderators?|checkers?|graders?)\b
            | \b(?:if|when|while)\s+you\s+are\s+(?:an?\s+|the\s+)?(?:(?:ai|llm|automated|security)\s+)+
              (?:reviewer|scanner|auditor|judge|analy[sz]er|classifier|evaluator|model|tool)\b
            | \b(?:if|when|while)\s+you\s+are\s+(?:an?\s+|the\s+)?
              (?:scanner|auditor|judge|analy[sz]er|classifier|evaluator|moderator)\b
            | \b(?:if|when|while)\s+(?:you\s+are\s+)?
              (?:reviewing|scanning|auditing|analy[sz]ing|evaluating|classifying|inspecting|judging)\s+(?:this|these)\s+
              (?:tools?|servers?|manifests?|descriptions?|text|packages?|prompts?|resources?|instructions)\b
            | \b(?:to|for)\s+(?:the|any|all|every)\s+(?:(?:ai|llm|automated|security)\s+)+
              (?:reviewers?|scanners?|auditors?|judges?|analy[sz]ers?|classifiers?|evaluators?|tools?|models?)\s*[:,]
            | (?m:^)[\ \t]*(?:(?:ai|llm|automated|security)\s+)+(?:reviewers?|scanners?|auditors?|judges?|analy[sz]ers?)\s*:
            | \b(?:the|any|an?)\s+(?:ai\s+|llm\s+|language\s+)?(?:model|assistant|agent|llm)\s+(?:that\s+is\s+|which\s+is\s+)?
              (?:analy[sz]ing|reviewing|auditing|scanning|evaluating|checking|inspecting|classifying|judging)\s+(?:this|these|it)\b
          )
          [\s\S]{0,200}?
          (?:
              \b(?:reply|respond|answer|return|output|report|say|conclude)\s+(?:with\s+|that\s+(?:there\s+(?:are|is)\s+)?)?
              (?:no|zero|0)\s+(?:findings|issues|problems|vulnerabilities|risks|threats)\b
            | \{\s*\\?"findings\\?"\s*:\s*\[\s*\]\s*\}
            | \b(?:this|the|these)\s+(?:tool|server|code|package|description|text|manifest|prompt|resource|instructions?|field|content|file)s?
              \s+(?:is|are|was|were|has\s+been|have\s+been)\s+(?:completely\s+|totally\s+|perfectly\s+|already\s+)?
              (?:safe|benign|harmless|trusted|trustworthy|clean|legitimate|approved|verified|audited|whitelisted|allowlisted|not\s+malicious)\b
            | \b(?:mark|classify|flag|label|rate|score|treat|consider|report|tag)\s+(?:this|it|them|these|the\s+(?:tool|server|text|description|manifest))
              \s+(?:as\s+)?(?:safe|benign|harmless|trusted|clean|legitimate|approved|low[\s-]risk|not\s+malicious|grade\s+a\b)
            | \b(?:do\s+not|don'?t|never)\s+(?:flag|report|mention|list|raise|include)\s+(?:this|it|anything|any\s+(?:findings|issues)|the\s+following)\b
            | \b(?:ignore|skip|disregard|overlook|exclude)\s+(?:the\s+following|this(?:\s+(?:section|part|text|field|tool|description))?|everything\s+(?:below|after\s+this))\b
            | \b(?:was|has\s+been|have\s+been)\s+(?:already\s+)?(?:audited|approved|verified|whitelisted|allowlisted|cleared|vetted)\b
            | \b(?:no|zero)\s+(?:findings|issues|vulnerabilities)\s+(?:should|must|need\s+to)\s+be\s+(?:reported|raised|flagged)\b
            | \b(?:give|assign)\s+(?:it|this)\s+(?:a\s+)?(?:perfect|high|maximum|full|top)\s+(?:score|rating|grade)\b
          )
        )
      # Verdict steering that only makes sense aimed at a scanner, with no greeting needed.
      - '\b(?:ignore|skip|disregard|overlook|exclude)\s+(?:the\s+following|this\s+(?:section|part|text|field|tool|description|content)|everything\s+(?:below|after\s+this))\s*,?\s*(?:when|while|during)\s+(?:(?:auditing|scanning|analy[sz]ing)\b|(?:a\s+|the\s+)?security\s+(?:review|reviews|reviewing|scan|scanning|audit|auditing|analysis)\b|reviewing\s+(?:this|the)\s+(?:tool|server|manifest|description|package)\b)'
      - '\b(?:reply|respond|answer|return|output|report)\s+(?:with\s+)?(?:no|zero|0)\s+findings\s+for\s+(?:this|these|any|all|every)\b'
      - '\b(?:mark|classify|label|flag|tag|treat)\s+this\s+(?:tool|server|description|manifest|package|code|text|field)\s+as\s+(?:benign|safe|clean|harmless|trusted|not\s+malicious)\b'

  # --- Smuggling through markup (tools only) --------------------------------------------

  - id: D1-HIDDEN-COMMENT
    module: D1
    severity: medium
    confidence: medium
    owasp: [MCP03]
    title: HTML or markdown comment in a tool description
    remediation: >-
      Remove the comment. Comments are not rendered for the user but the model reads them.
    kind: regex
    surfaces: [tools]
    patterns:
      - '<!--[\s\S]*?(?:-->|$)'
      - '(?m:^[ \t]*\[(?://|comment|#)?\]:\s*(?:#|<>))'

  - id: D1-HIDDEN-HTML
    module: D1
    severity: high
    confidence: medium
    owasp: [MCP03]
    title: HTML that hides text from the reader
    remediation: >-
      Remove the hidden element. Text styled to be invisible is only there for the model.
    kind: regex
    surfaces: [tools]
    patterns:
      - '<[a-z][^>]*\bstyle\s*=\s*["''][^"'']*(?:display\s*:\s*none|visibility\s*:\s*hidden|font-size\s*:\s*0|opacity\s*:\s*0(?:\.0+)?\s*(?:;|["''])|color\s*:\s*(?:white|transparent|#fff(?:fff)?)\b)'
      - '<[a-z][a-z0-9]*\b[^>]*\shidden\b[^>]*>'

  - id: D1-ACTIVE-HTML
    module: D1
    severity: high
    confidence: medium
    owasp: [MCP03]
    title: Script or embedded-object HTML in a tool description
    remediation: >-
      Remove the markup. Scripts, frames, embedded objects and event handlers have no place
      in text that clients may render.
    kind: regex
    surfaces: [tools]
    patterns:
      - '<\s*(?:script|iframe)\b'
      - '<\s*(?:object|embed)\s+[a-z]'   # real embeds carry attributes; <object> alone is a placeholder
      - '\bjavascript\s*:'
      - '<[a-z][^>]*\son(?:load|error|click|mouseover|focus)\s*='

  - id: D1-REMOTE-IMAGE
    module: D1
    severity: medium
    confidence: medium
    owasp: [MCP03]
    title: Remote image in a tool description (possible data beacon)
    remediation: >-
      Remove the image. When a client renders it, the request can leak data placed in the
      URL, and it tells the attacker the description was shown.
    kind: regex
    surfaces: [tools]
    patterns:
      - '!\[[^\]]*\]\(\s*<?(?:https?:)?//'
      - '<img\b[^>]*\bsrc\s*=\s*["'']?(?:https?:)?//'

# D4 secrets (static): keys and tokens in the manifest and in the target's location and
# arguments.
#
# A pattern may capture the secret in a group named `secret` (or `secret_2`, `secret_3`, ...
# when a rule has several patterns, since group names must be unique). Only that part is
# redacted in evidence, so `api_key=zira****` still shows which key leaked; without such a
# group the whole match is the secret. Evidence keeps at most 4 characters of a secret.
#
# `min_entropy` drops placeholders such as sk-xxxxxxxx...; documentation values are also
# excluded by name (AWS's ...EXAMPLE keys, "your", "changeme", ${VAR}, <token>).
#
# These patterns are also used to redact secrets in the evidence of every other module.
rules:
  - id: D4-AWS-ACCESS-KEY
    module: D4
    severity: critical
    confidence: high
    owasp: [MCP01]
    title: AWS access key ID
    remediation: >-
      Remove the key and rotate it in AWS IAM. Pass credentials through the environment or
      a credential provider, never in tool text or arguments.
    kind: regex
    ignore_case: false
    min_entropy: 2.5
    surfaces: [tools, prompts, resources, instructions, server, target]
    patterns:
      - '\b(?P<secret>(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16})\b(?<!EXAMPLE)'

  - id: D4-AWS-SECRET-KEY
    module: D4
    severity: critical
    confidence: high
    owasp: [MCP01]
    title: AWS secret access key
    remediation: >-
      Remove the key and rotate it in AWS IAM. Pass credentials through the environment or
      a credential provider.
    kind: regex
    min_entropy: 3.5
    surfaces: [tools, prompts, resources, instructions, server, target]
    patterns:
      - 'aws_?secret_?access_?key["'']?\s*[:=\s]\s*["'']?(?P<secret>[A-Za-z0-9/+=]{40})(?![A-Za-z0-9/+=])'

  - id: D4-GITHUB-TOKEN
    module: D4
    severity: critical
    confidence: high
    owasp: [MCP01]
    title: GitHub token
    remediation: >-
      Revoke the token in GitHub settings and pass a new one through the environment.
    kind: regex
    ignore_case: false
    min_entropy: 2.5
    surfaces: [tools, prompts, resources, instructions, server, target]
    patterns:
      - '\b(?P<secret>gh[pousr]_[A-Za-z0-9]{36,255})\b'
      - '\b(?P<secret_2>github_pat_[A-Za-z0-9_]{22,255})\b'

  - id: D4-OPENAI-KEY
    module: D4
    severity: critical
    confidence: high
    owasp: [MCP01]
    title: OpenAI API key
    remediation: >-
      Revoke the key in the OpenAI dashboard and pass a new one through the environment.
    kind: regex
    ignore_case: false
    min_entropy: 2.5
    surfaces: [tools, prompts, resources, instructions, server, target]
    patterns:
      - '(?<![A-Za-z0-9_-])(?P<secret>sk-(?!ant-)(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,})'

  - id: D4-ANTHROPIC-KEY
    module: D4
    severity: critical
    confidence: high
    owasp: [MCP01]
    title: Anthropic API key
    remediation: >-
      Revoke the key in the Anthropic Console and pass a new one through the environment.
    kind: regex
    ignore_case: false
    min_entropy: 2.5
    surfaces: [tools, prompts, resources, instructions, server, target]
    patterns:
      - '(?<![A-Za-z0-9_-])(?P<secret>sk-ant-(?:api|admin|oat)\d{2}-[A-Za-z0-9_-]{20,})'

  - id: D4-SLACK-TOKEN
    module: D4
    severity: critical
    confidence: high
    owasp: [MCP01]
    title: Slack token or webhook
    remediation: >-
      Revoke the token or webhook in the Slack app settings and pass a new one through the
      environment.
    kind: regex
    ignore_case: false
    min_entropy: 2.5
    surfaces: [tools, prompts, resources, instructions, server, target]
    patterns:
      - '\b(?P<secret>xox[abposr]-[A-Za-z0-9-]{10,})'
      - 'https://hooks\.slack\.com/services/(?P<secret_2>T[A-Z0-9]{6,}/B[A-Z0-9]{6,}/[A-Za-z0-9]{16,})'

  - id: D4-PRIVATE-KEY
    module: D4
    severity: critical
    confidence: high
    owasp: [MCP01]
    title: Private key
    remediation: >-
      Remove the key, treat it as compromised and replace it. Private keys belong in a key
      store or file referenced by path, never in text.
    kind: regex
    ignore_case: false
    surfaces: [tools, prompts, resources, instructions, server, target]
    patterns:
      - '-----BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY(?: BLOCK)?-----(?P<secret>[^-]*)'

  - id: D4-JWT
    module: D4
    severity: high
    confidence: medium
    owasp: [MCP01]
    title: JSON Web Token
    remediation: >-
      Remove the token and revoke it if it is still valid. Tokens should be issued at run
      time, not stored in tool text or arguments.
    kind: regex
    ignore_case: false
    surfaces: [tools, prompts, resources, instructions, server, target]
    patterns:
      - '\b(?P<secret>eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*)'

  - id: D4-URL-CREDENTIALS
    module: D4
    severity: high
    confidence: high
    owasp: [MCP01]
    title: Credentials in a URL
    remediation: >-
      Remove the credentials from the URL and rotate them. URLs end up in logs, histories
      and reports.
    kind: regex
    surfaces: [tools, prompts, resources, instructions, server, target]
    patterns:
      - '\b[a-z][a-z0-9+.-]*://[^\s/:@]+:(?P<secret>(?!(?:password|passwd|pass|pwd|secret|changeme|x{3,})@)(?![$<{*])[^\s/@]{3,})@'
      - '[?&](?:api[_-]?key|apikey|token|access_token|auth|key|secret|client_secret|sig|signature|password)=(?P<secret_2>(?![^&\s#"'']*(?:your|example|placeholder|xxxx))[^&\s#"''{}<>$]{8,})'

  - id: D4-SECRET-ASSIGNMENT
    module: D4
    severity: high
    confidence: medium
    owasp: [MCP01]
    title: High-entropy value assigned to a secret-named key
    remediation: >-
      Remove the value and rotate it. Read secrets from the environment or a secret manager
      at run time.
    kind: regex
    min_entropy: 3.5
    surfaces: [tools, prompts, resources, instructions, server, target]
    patterns:
      # Not after ? or &: query parameters are D4-URL-CREDENTIALS.
      - '(?<![?&A-Za-z])(?:api[_-]?key|apikey|secret|token|passwd|password|(?<!secret_)access[_-]?key|client[_-]?secret|private[_-]?key|auth[_-]?token)["'']?\s*(?:[:=]|\s)\s*["'']?(?P<secret>(?!(?:gh[pousr]_|github_pat_|sk-|xox[abposr]-|AKIA|ASIA|eyJ))(?![^\s"'']*(?:your|example|placeholder|changeme|dummy|sample|xxxx|redacted))(?=[A-Za-z0-9/+_=.-]*\d)(?=[A-Za-z0-9/+_=.-]*[A-Za-z])[A-Za-z0-9/+_=.-]{16,})'
      - '\bBearer\s+(?P<secret_2>(?!(?:gh[pousr]_|github_pat_|sk-|xox[abposr]-|eyJ))(?![^\s"'']*(?:your|example|placeholder|xxxx))[A-Za-z0-9._~+/=-]{16,})'

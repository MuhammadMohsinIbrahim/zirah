[project]
name = "zirah"
version = "0.1.0.dev0"
description = "Offline-first security scanner and trust registry for MCP servers."
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["mcp", "security", "scanner", "ai-agents", "supply-chain"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zirah"]

[project]
name = "zirah-mcp"
dynamic = ["version"]
description = "Offline-first security scanner and trust registry for MCP servers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Mohsin Ibrahim" }]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "model-context-protocol",
    "security",
    "scanner",
    "prompt-injection",
    "tool-poisoning",
    "ai-agents",
    "supply-chain",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "rich>=13.9",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/MuhammadMohsinIbrahim/zirah-mcp"
Repository = "https://github.com/MuhammadMohsinIbrahim/zirah-mcp"
Issues = "https://github.com/MuhammadMohsinIbrahim/zirah-mcp/issues"
Changelog = "https://github.com/MuhammadMohsinIbrahim/zirah-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/MuhammadMohsinIbrahim/zirah-mcp/blob/main/SECURITY.md"

[project.scripts]
zirah = "zirah.cli:app"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "zirah/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["zirah"]

name: Release

# Pushing a tag vX.Y.Z publishes Zirah X.Y.Z with PyPI trusted publishing (OIDC, no tokens):
#
#   build -> publish-testpypi -> verify-testpypi -> publish-pypi -> verify-pypi -> github-release
#
# publish-pypi runs in the "pypi" environment, which requires a maintainer's approval.
# github-release only creates a DRAFT release; a maintainer reviews and publishes it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # no shared cache in the release path

      - name: Check the tag matches the version and is on main
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' core/zirah/__init__.py)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
          if ! grep -q "^## \[$version\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the sdist and wheel
        run: uv build --package zirah --out-dir dist

      - name: Check the wheel contents
        run: |
          contents=$(unzip -l dist/*.whl)
          for path in zirah/py.typed zirah/rules/pack.yaml zirah/rules/d1_tool_poisoning.yaml \
                      licenses/LICENSE; do
            grep -q "$path" <<< "$contents" || { echo "::error::wheel lacks $path"; exit 1; }
          done

      - name: Smoke-test the wheel
        run: |
          uv venv .smoke --python 3.12
          uv pip install --python .smoke dist/*.whl
          uv run --no-project python .github/scripts/release_smoke.py \
            "${{ steps.version.outputs.version }}" .smoke/bin/python -m zirah

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/zirah/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Install from TestPyPI (${{ matrix.os }})
    needs: [build, publish-testpypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # Only the zirah wheel comes from TestPyPI; its dependencies come from PyPI, so a
      # look-alike package on TestPyPI can never be installed.
      - name: Download the wheel from TestPyPI
        run: |
          for attempt in $(seq 1 20); do
            if uvx pip download --no-deps --only-binary :all: --dest wheel \
                 --index-url https://test.pypi.org/simple/ "zirah==$VERSION"; then
              exit 0
            fi
            echo "not on the TestPyPI index yet (attempt $attempt); waiting"
            sleep 30
          done
          exit 1

      - name: Install it with dependencies from PyPI
        run: |
          uv venv .smoke --python 3.12
          uv pip install --python .smoke wheel/zirah-*.whl

      - name: Smoke-test
        run: |
          if [ "$RUNNER_OS" = Windows ]; then python=.smoke/Scripts/python.exe; else python=.smoke/bin/python; fi
          uv run --no-project python .github/scripts/release_smoke.py "$VERSION" "$python" -m zirah

  publish-pypi:
    name: Publish to PyPI
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi # requires a maintainer's approval
      url: https://pypi.org/project/zirah/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify-pypi:
    name: pipx install from PyPI (${{ matrix.os }})
    needs: [build, publish-pypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: pipx install zirah==${{ needs.build.outputs.version }}
        run: |
          uv python install 3.12
          python=$(uv python find 3.12)
          for attempt in $(seq 1 20); do
            if pipx install --python "$python" "zirah==$VERSION"; then
              exit 0
            fi
            echo "not on the PyPI index yet (attempt $attempt); waiting"
            sleep 30
          done
          exit 1

      - name: Smoke-test
        run: uv run --no-project python .github/scripts/release_smoke.py "$VERSION" zirah

  github-release:
    name: Draft the GitHub release
    needs: [build, verify-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create a draft release with the CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Zirah $VERSION" --notes-file notes.md
